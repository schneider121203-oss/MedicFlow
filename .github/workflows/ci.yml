name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mediflow_test
          POSTGRES_USER: mediflow
          POSTGRES_PASSWORD: mediflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mediflow -d mediflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mediflow:mediflow_test@localhost:5432/mediflow_test
      SECRET_KEY: ci_only_secret_key_with_more_than_32_characters
      REGISTRATION_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check backend tests scripts
      - run: pytest -q
      - run: python -m compileall -q backend scripts
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m scripts.validate_isolation
